name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main   # or your default branch

permissions:
  contents: write     # required to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'   # Change as appropriate

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build     # Adjust based on your build script
        # For Create React App, this creates 'build' directory

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages              # The branch the action deploys to
          folder: build                 # The folder to deploy (e.g., 'build' for React, 'dist' for Vue)
